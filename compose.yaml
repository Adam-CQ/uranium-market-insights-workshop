services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: dashboard
      POSTGRES_DB: uranium
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard -d uranium"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
